# kate / minimal bundle — ApplicationSet + service registry.
#
# Single-component bundle: hermes only, no honcho memory backend.
# The hermes entry in services.yaml points at this same directory
# (bundles/minimal), where kustomization.yaml bases on apnex/hermes
# and merges three overrides (config.yaml.tpl, honcho.json.tpl,
# wanted-plugins.yaml) to disable the honcho-tuned memory plugin.
#
# Applied directly:
#   kubectl apply -f https://raw.githubusercontent.com/apnex/kate/main/bundles/minimal/services.appset.yaml
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kate-minimal
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - git:
        repoURL: https://github.com/apnex/kate
        revision: HEAD
        files:
          - path: bundles/minimal/services.yaml
  template:
    metadata:
      name: '{{ .name }}'
    spec:
      project: default
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'
      source:
        repoURL: '{{ .repoURL }}'
        targetRevision: '{{ .revision }}'
      syncPolicy:
        automated:
          selfHeal: true
          prune: true
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: 5
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 10m
  templatePatch: |
    spec:
      source:
        {{- if eq .type "helm" }}
        chart: {{ .chart | quote }}
        {{- if .values }}
        helm:
          valuesObject: {{ .values | toJson }}
        {{- end }}
        {{- else }}
        path: {{ .gitPath | quote }}
        {{- end }}
