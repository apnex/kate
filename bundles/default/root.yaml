# kate / default bundle — app-of-apps root.
#
# This Application watches bundles/default/applications/ and reconciles
# every Application manifest found there. Adding a new file in that folder
# adds a new component to the bundle; removing one prunes it.
#
# Applied transitively when kate.yaml (repo root) is installed, or directly
# via:
#   kubectl apply -f https://raw.githubusercontent.com/apnex/kate/main/bundles/default/root.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kate-default
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/apnex/kate
    targetRevision: main
    path: bundles/default/applications
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
