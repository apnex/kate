# vip-hermes — MetalLB LoadBalancer that exposes the hermes ClusterIP
# Service at a stable LAN address. Network/exposure concern, lives in
# labops alongside other vip-* services.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vip-hermes
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/apnex/labops
    targetRevision: master
    path: vip-hermes
  destination:
    server: https://kubernetes.default.svc
    namespace: hermes
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
