# hermes — agent harness (Deployment, ConfigMaps, ClusterIP Service).
# Source: apnex/hermes — the canonical Hermes Agent deploy manifests.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hermes
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/apnex/hermes
    targetRevision: main
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: hermes
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
