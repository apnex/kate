# vip-honcho — MetalLB LoadBalancer exposing honcho on the LAN VIP.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vip-honcho
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/apnex/labops
    targetRevision: master
    path: vip-honcho
  destination:
    server: https://kubernetes.default.svc
    namespace: honcho
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
