# kate — opinionated agent platform on Kubernetes
#
# This file is the install entry point. Applying it bootstraps the default
# bundle's ApplicationSet, which reads bundles/default/services.yaml and
# creates one ArgoCD Application per registry entry.
#
# Install:
#   kubectl apply -f https://raw.githubusercontent.com/apnex/kate/main/kate.yaml
#
# Pre-requisites (see prereqs/README.md):
#   - Kubernetes cluster (k3s/k8s 1.28+)
#   - ArgoCD installed in the `argocd` namespace
#   - LoadBalancer support (any CNI/controller — kate is substrate-agnostic)
#   - Substrate-level defaults configured (e.g. labops provides MetalLB +
#     Kyverno policies that decorate LoadBalancer Services with pool
#     annotations)
#
# To install a different bundle (e.g. minimal, voice) once they exist,
# apply that bundle's services.appset.yaml under bundles/<name>/ instead.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kate
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/apnex/kate
    targetRevision: main
    path: bundles/default
    directory:
      include: 'services.appset.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
